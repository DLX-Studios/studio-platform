[package]
name = "studio-script"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Studio Script parser of record, canonical printer, and compiler boundary"

[dependencies]
serde.workspace = true
serde_json.workspace = true
studio-protocol = { path = "../studio-protocol" }
sha2.workspace = true
thiserror.workspace = true
oxc_allocator = "0.146"

# Pinned Svelte-compatible frontend, vendored under vendor/rsvelte (see
# vendor/rsvelte/UPSTREAM.md): the Engine facade (fingerprints, analysis facts)
# and the rsvelte_core parse API (template tree) behind rsvelte_adapter.
# Never call compile()/compile_both() — generated JavaScript is forbidden.
rsvelte = { path = "../../vendor/rsvelte/rsvelte", default-features = false }
rsvelte_core = { path = "../../vendor/rsvelte/rsvelte_core", default-features = false }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.23"
