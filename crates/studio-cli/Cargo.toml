[package]
name = "studio-cli"
version = "0.1.0"
edition = "2021"
description = "Unified Rust CLI for Studio — dev/build/preview/generate, replacing scripts/build-example.ts vite-like"
license = "Apache-2.0"

[[bin]]
name = "studio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
studio-package = { path = "../studio-package" }
walkdir = "2.5"
regex = "1.11"
studio-script = { path = "../studio-script" }
