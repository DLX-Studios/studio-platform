[package]
name = "studio-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
gpui-kit.workspace = true
studio-runtime = { path = "../studio-runtime", default-features = false }
studio-package = { path = "../studio-package" }
studio-security = { path = "../studio-security" }

[features]
default = ["services"]
services = ["studio-runtime/services"]

[dev-dependencies]
studio-runtime = { path = "../studio-runtime", default-features = false, features = ["development"] }
futures = "0.3.34"
parking_lot = "0.12.5"
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
studio-actions = { path = "../studio-actions" }
studio-components = { path = "../studio-components" }
studio-github = { path = "../studio-github" }
studio-host = { path = "../studio-host" }
studio-navigation = { path = "../studio-navigation" }
studio-net = { path = "../studio-net" }
studio-oauth = { path = "../studio-oauth" }
studio-protocol = { path = "../studio-protocol" }
studio-ui = { path = "../studio-ui" }
studio-wasm = { path = "../studio-wasm" }
thiserror.workspace = true
zeroize.workspace = true

ed25519-dalek.workspace = true
wat.workspace = true

[[test]]
name = "plugin_launch"
path = "../../tests/integration/plugin_launch.rs"
required-features = ["services"]

[[test]]
name = "catalog_latency"
path = "../../tests/performance/catalog_latency.rs"

[[test]]
name = "redaction"
path = "../../tests/security/redaction.rs"

[[test]]
name = "protected_payment"
path = "../../tests/integration/protected_payment.rs"
required-features = ["services"]

[[test]]
name = "checkout_navigation"
path = "../../tests/integration/checkout_navigation.rs"
required-features = ["services"]

[[test]]
name = "developer_errors"
path = "../../tests/integration/developer_errors.rs"

[[test]]
name = "plugin_recovery"
path = "../../tests/integration/plugin_recovery.rs"

[[test]]
name = "compositor_disconnect"
path = "../../tests/integration/compositor_disconnect.rs"
required-features = ["services"]



[lints]
workspace = true
