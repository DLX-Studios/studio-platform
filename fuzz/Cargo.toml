[package]
name = "studio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
studio-actions = { path = "../crates/studio-actions" }
studio-package = { path = "../crates/studio-package" }
studio-protocol = { path = "../crates/studio-protocol" }
studio-ui = { path = "../crates/studio-ui" }

[workspace]
members = ["."]

[[bin]]
name = "protocol_decode"
path = "fuzz_targets/protocol_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "patch_transaction"
path = "fuzz_targets/patch_transaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_parse"
path = "fuzz_targets/bundle_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "action_payload"
path = "fuzz_targets/action_payload.rs"
test = false
doc = false
bench = false
