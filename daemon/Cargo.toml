[package]
name = "sb-daemon"
version = "0.3.0"
edition = "2024"
description = "Studio Builder in-guest daemon: dials home to the dashboard, reports probes, executes commands"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time", "signal"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
