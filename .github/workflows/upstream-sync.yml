name: Upstream synchronization check

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check latest Zed and gpui-component pins
        run: ./scripts/check-upstream-sync.sh
