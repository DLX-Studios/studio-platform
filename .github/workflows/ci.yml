name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reload-transport:
    name: Reload transport (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-04
      - name: Test native reload transport
        run: cargo test --locked -p studio-protocol --lib reload::tests
      - name: Check native CLI and reload test targets
        run: cargo check --locked -p studio-cli --tests

  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-04
          components: clippy,rustfmt

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - uses: astral-sh/setup-uv@v6

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libclang-dev \
            clang \
            sway

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Validate Spec Kit integration
        run: >-
          uvx --from git+https://github.com/github/spec-kit.git@v0.15.2
          specify integration status

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --locked --workspace

      - name: Validate AssemblyScript and tooling
        run: bun run check

      - name: Test tooling
        run: bun test

      - name: Reject generated artifact drift
        run: git diff --exit-code -- protocol sdk/assemblyscript/assembly/generated

      - name: Check native platform features
        run: ./scripts/check-platform-features.sh

      - name: Build native probe
        run: cargo build --locked --release -p studio-app

      - name: Test native headless Wayland startup
        env:
          STUDIO_APP_BINARY: ${{ github.workspace }}/target/release/studio-app
        run: ./scripts/test-headless-wayland.sh
