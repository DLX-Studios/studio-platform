[package]
name = "gpui-component-assets"
version = "0.5.1-studio.1"
edition = "2024"
license = "Apache-2.0"
publish = false
links = "gpui-component-default-icons"

[lib]
doctest = false

[dependencies]
anyhow = "1"
gpui = { git = "https://github.com/zed-industries/zed", rev = "381953d44897c53c4d252ae30620bafaa7d060b7", default-features = false, features = ["wayland"] }
log = "0.4"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }
