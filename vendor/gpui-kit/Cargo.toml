[package]
description = "GPUI Kit: one dependency for building desktop applications with GPUI, GPUI Base, GPUI Component and default assets."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
categories = ["gui"]
license = "Apache-2.0"
name = "gpui-kit"
documentation = "https://docs.rs/gpui-kit"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
version = "0.7.0-studio.1"
publish = false
edition = "2024"
rust-version = "1.93"

[lib]
name = "gpui_kit"
doctest = false

[features]
default = ["component", "assets"]
# The styled component library, `gpui_kit::component`. Initializes `gpui-base` too.
component = ["dep:gpui-component"]
# The default icon set for `gpui-component`, `gpui_kit::assets`.
assets = ["dep:gpui-kit-assets"]
# GPUI's test harness and the Kit UI test helpers.
test-support = ["gpui/test-support", "gpui-base/test-support", "gpui-component?/test-support"]
inspector = ["gpui/inspector", "gpui-base/inspector", "gpui-component?/inspector"]
decimal = ["component", "gpui-component/decimal"]

[dependencies]
gpui = { version = "=0.3.7", package = "gpui-pre", default-features = false, features = ["wayland"] }
gpui-base = { path = "../gpui-base" }
gpui-component = { path = "../gpui-component", optional = true }
gpui-kit-assets = { path = "../gpui-kit-assets", optional = true }

# Studio delta: upstream enables `font-kit`, `x11`, and `runtime_shaders` here.
# Principle V forbids linking X11/XCB, so only the Wayland backend is enabled.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
gpui_platform = { version = "=0.3.7", package = "gpui-pre-platform", default-features = false, features = ["wayland"] }