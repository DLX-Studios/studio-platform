[package]
name = "gpui-component"
version = "0.5.2-studio.1"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Audited gpui-component distribution for Studio's Wayland runtime"
publish = false

[lib]
doctest = false
test = false
bench = false

[features]
default = []
decimal = ["dep:rust_decimal"]
inspector = ["gpui_macros/inspector", "gpui/inspector"]
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-json"]

[dependencies]
aho-corasick = "1.1.3"
anyhow = "1"
async-channel = "2.3.1"
chrono = "0.4.38"
enum-iterator = "2.1.0"
futures = "0.3"
gpui = { git = "https://github.com/zed-industries/zed", rev = "381953d44897c53c4d252ae30620bafaa7d060b7", default-features = false, features = ["wayland"] }
gpui_macros = { git = "https://github.com/zed-industries/zed", rev = "381953d44897c53c4d252ae30620bafaa7d060b7" }
gpui-component-assets = { path = "../gpui-component-assets" }
gpui-component-macros = { path = "../gpui-component-macros" }
html5ever = "0.27"
instant = { version = "0.1", features = ["wasm-bindgen"] }
itertools = "0.13.0"
log = "0.4"
lsp-types = { version = "0.97.0", features = ["proposed"] }
markdown = { version = "1.0.0", features = ["serde"] }
markup5ever_rcdom = "0.3.0"
notify = "7.0.0"
num-traits = "0.2"
once_cell = "1.19.0"
paste = "1"
regex = "1"
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
rust-i18n = "4.2.0"
rust_decimal = { version = "1.37.0", optional = true }
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
smallvec = "1"
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
tracing = "0.1.41"
unicode-segmentation = "1.12.0"
uuid = "1.10"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
smol = "2"
tree-sitter = { version = "0.26", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
