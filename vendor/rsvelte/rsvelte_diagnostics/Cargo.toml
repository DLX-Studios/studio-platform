[package]
name = "rsvelte_diagnostics"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Shared diagnostic records and renderers for rsvelte workspace tools"
license = "MIT"
repository = "https://github.com/baseballyama/rsvelte"
publish = false
autobins = false
autobenches = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[lints.rust]
# Vendored upstream lint contract (rsvelte workspace root at the pinned rev).
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
format_push_string = "deny"
too_many_arguments = "allow"
type_complexity = "allow"
