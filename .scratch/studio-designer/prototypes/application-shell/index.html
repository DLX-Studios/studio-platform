<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio Designer — application shell prototype</title>
  <!-- Two welcome-screen directions, switchable with ?variant=A|B. A is the default; every screen shares native window chrome. Throwaway prototype. -->
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.141 0.005 285.823);
      --panel: oklch(0.21 0.006 285.885);
      --panel-2: oklch(0.235 0.006 286);
      --panel-3: oklch(0.274 0.006 286.033);
      --line: oklch(1 0 0 / 10%);
      --line-strong: oklch(1 0 0 / 18%);
      --text: oklch(0.985 0 0);
      --muted: oklch(0.705 0.015 286.067);
      --soft: oklch(0.82 0.008 286);
      --brand: oklch(0.92 0.004 286.32);
      --brand-2: oklch(0.985 0 0);
      --brand-wash: oklch(1 0 0 / 7%);
      --green: oklch(0.92 0.004 286.32);
      --amber: oklch(0.78 0.012 286);
      --red: oklch(0.704 0.191 22.216);
      --shadow: 0 20px 60px #0009;
      --radius: 0px;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --font-heading: "Instrument Sans", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-family: var(--font-mono);
    }
    * { box-sizing: border-box; }
    html, body, #app { width: 100%; min-height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .app { min-height: 100vh; background: radial-gradient(circle at 50% -20%, #24213c 0, transparent 40%), var(--bg); }
    .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; color: white; background: linear-gradient(145deg, #a393ff, #6750df); box-shadow: inset 0 0 0 1px #ffffff2b; font-weight: 800; }
    .brand-name { font-weight: 720; letter-spacing: -.02em; }
    .small { color: var(--muted); font-size: 12px; }
    .eyebrow { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .17em; text-transform: uppercase; }
    .display { margin: 0; font-size: clamp(42px, 5.4vw, 78px); line-height: .97; letter-spacing: -.065em; }
    .headline { margin: 0; font-size: clamp(28px, 3.4vw, 48px); line-height: 1.03; letter-spacing: -.05em; }
    .lead { max-width: 590px; color: var(--soft); font-size: 15px; line-height: 1.75; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.wrap { flex-wrap: wrap; }
    .spacer { flex: 1; }
    .primary, .secondary, .ghost, .icon-btn, .mode-btn { min-height: 38px; border-radius: 9px; border: 1px solid transparent; padding: 0 15px; background: transparent; }
    .primary { background: var(--brand); color: white; font-weight: 720; box-shadow: 0 9px 24px #7965ff35; }
    .primary:hover { background: #9b8aff; }
    .secondary { border-color: var(--line-strong); background: var(--panel-2); }
    .secondary:hover, .ghost:hover, .mode-btn:hover { background: var(--panel-3); }
    .ghost { color: var(--soft); padding-inline: 11px; }
    .icon-btn { width: 38px; padding: 0; border-color: var(--line); background: var(--panel); }
    .badge { display: inline-flex; align-items: center; gap: 6px; min-height: 23px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 999px; color: var(--soft); background: #11141ae8; font-size: 10px; white-space: nowrap; }
    .badge.green { color: var(--green); border-color: #3dd6a34f; background: #12342b; }
    .badge.amber { color: var(--amber); border-color: #f1bf6355; background: #342712; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .field { display: grid; gap: 7px; }
    .field label { color: var(--soft); font-size: 12px; font-weight: 650; }
    .input, .select { width: 100%; height: 43px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 12px; color: var(--text); background: #0d1015; }
    .input::placeholder { color: #687182; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(155deg, #191d25, #12151b); box-shadow: 0 12px 38px #0003; }
    .card:hover { border-color: var(--line-strong); }
    .empty { display: grid; place-items: center; min-height: 220px; border: 1px dashed var(--line-strong); border-radius: var(--radius); color: var(--muted); }
    .avatar { display: grid; place-items: center; width: 46px; height: 46px; border: 1px solid #ffffff24; border-radius: 50%; background: linear-gradient(145deg, #537b8d, #273b47); font-size: 13px; font-weight: 800; }
    .avatar.cloud { background: linear-gradient(145deg, #8e79e9, #433476); }
    .status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .status-line .dot { color: var(--green); }

    /* Authenticated desktop shell — native title bar plus contextual application controls. */
    .shell-a { min-height: 100vh; }
    .native-titlebar {
      position: relative;
      z-index: 200;
      display: flex;
      height: 52px;
      min-width: 0;
      align-items: stretch;
      border-bottom: 1px solid var(--line);
      background: color-mix(in oklch, var(--bg) 96%, transparent);
      backdrop-filter: blur(18px);
      -webkit-app-region: drag;
      user-select: none;
    }
    .native-titlebar button,
    .native-titlebar select,
    .native-titlebar .no-drag { -webkit-app-region: no-drag; }
    .titlebar-route { display: flex; min-width: 235px; align-items: center; border-right: 1px solid var(--line); }
    .route-back { width: 46px; height: 100%; padding: 0; border: 0; border-right: 1px solid var(--line); color: var(--soft); background: transparent; font-size: 18px; }
    .route-back:hover { color: var(--text); background: var(--brand-wash); }
    .route-mark { display: grid; width: 28px; height: 28px; margin-left: 12px; place-items: center; color: var(--bg); background: var(--text); font-weight: 800; }
    .route-copy { min-width: 0; padding: 0 13px 0 10px; }
    .route-title { overflow: hidden; font-family: var(--font-heading); font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .route-crumbs { overflow: hidden; margin-top: 3px; color: var(--muted); font-size: 8px; letter-spacing: .08em; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
    .titlebar-context { display: flex; min-width: 0; flex: 1; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; overflow: hidden; }
    .titlebar-context .secondary,
    .titlebar-context .ghost,
    .titlebar-context .primary { min-height: 32px; padding-inline: 10px; font-size: 10px; }
    .titlebar-segment { display: inline-flex; height: 32px; border: 1px solid var(--line-strong); background: var(--bg); }
    .titlebar-segment button { min-width: 46px; padding: 0 9px; border: 0; border-right: 1px solid var(--line); color: var(--muted); background: transparent; font-size: 9px; }
    .titlebar-segment button:last-child { border-right: 0; }
    .titlebar-segment button:hover { color: var(--text); background: var(--brand-wash); }
    .titlebar-segment button.active { color: var(--bg); background: var(--text); }
    .titlebar-profile { width: auto; max-width: 178px; height: 32px; padding-right: 26px; font-size: 9px; }
    .titlebar-orientation button { display: grid; width: 32px; min-width: 32px; padding: 0; place-items: center; }
    .orientation-glyph { display: block; border: 1px solid currentColor; }
    .orientation-glyph.portrait { width: 8px; height: 13px; }
    .orientation-glyph.landscape { width: 13px; height: 8px; }
    .titlebar-actions { position: relative; display: flex; align-items: center; border-left: 1px solid var(--line); }
    .titlebar-actions > .badge { margin-inline: 9px; }
    .titlebar-actions .icon-btn { width: 36px; min-height: 36px; border: 0; border-left: 1px solid var(--line); }
    .titlebar-actions .avatar { width: 34px; height: 34px; margin: 0 9px; font-size: 10px; }
    .editor-more-menu { position: absolute; z-index: 140; top: 45px; right: 0; width: 210px; padding: 6px; border: 1px solid var(--line-strong); background: var(--panel); box-shadow: 0 18px 45px #000a; }
    .editor-more-label { padding: 7px 8px 6px; color: var(--muted); font-size: 8px; letter-spacing: .14em; text-transform: uppercase; }
    .editor-menu-item { display: flex; width: 100%; min-height: 36px; padding: 0 9px; align-items: center; justify-content: space-between; border: 0; color: var(--soft); background: transparent; font-size: 10px; text-align: left; }
    .editor-menu-item:hover { color: var(--text); background: var(--brand-wash); }
    .editor-menu-item span:last-child { color: var(--muted); font-size: 8px; }
    .editor-menu-divider { height: 1px; margin: 5px 0; background: var(--line); }
    .window-controls { display: flex; height: 100%; border-left: 1px solid var(--line); -webkit-app-region: no-drag; }
    .window-control { width: 43px; height: 100%; padding: 0; border: 0; border-left: 1px solid var(--line); color: var(--muted); background: transparent; font-size: 12px; }
    .window-control:first-child { border-left: 0; }
    .window-control:hover { color: var(--text); background: var(--brand-wash); }
    .window-control.close:hover { color: white; background: var(--red); }
    .shell-a .surface { min-height: calc(100vh - 52px); }
    .shell-a .surface-inner { width: min(1500px, calc(100vw - 68px)); margin: 0 auto; padding: 46px 0 110px; }
    .shell-a .welcome { display: grid; grid-template-columns: minmax(380px, .85fr) minmax(520px, 1.15fr); min-height: calc(100vh - 170px); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; background: #101319; }
    .shell-a .welcome-copy { display: flex; flex-direction: column; justify-content: center; padding: clamp(38px, 6vw, 90px); border-right: 1px solid var(--line); }
    .shell-a .welcome-art { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 30%, #8f7cff26, transparent 46%), linear-gradient(145deg, #151821, #0d0f14); }
    .shell-a .project-float { position: absolute; width: 48%; min-width: 280px; border: 1px solid var(--line-strong); border-radius: 13px; background: #171a21; box-shadow: var(--shadow); overflow: hidden; }
    .shell-a .project-float.one { top: 12%; left: 10%; transform: rotate(-2deg); }
    .shell-a .project-float.two { right: 8%; bottom: 13%; transform: rotate(2deg); }

    .float-head { display: flex; align-items: center; justify-content: space-between; height: 35px; padding: 0 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .11em; }
    .float-art { height: 150px; padding: 14px; background: linear-gradient(145deg, #1d2230, #11141a); }
    .mini-layout { height: 100%; display: grid; grid-template-columns: 28% 1fr; gap: 10px; }
    .mini-layout > div { border: 1px solid #ffffff13; border-radius: 5px; background: #0c0f14; }
    .mini-layout > div:last-child { background: linear-gradient(#8f7cff35 18%, #11141a 18%); }

    .auth-wrap { width: min(100%, 1040px); margin: 0 auto; }
    .auth-head { margin-bottom: 30px; }
    .identity-grid { display: grid; grid-template-columns: repeat(3, minmax(210px, 1fr)); gap: 13px; }
    .identity-card { display: grid; gap: 18px; padding: 19px; text-align: left; }
    .identity-card .identity-top { display: flex; align-items: center; justify-content: space-between; }
    .identity-card h3 { margin: 0 0 4px; font-size: 15px; }
    .identity-actions { margin-top: 22px; display: flex; gap: 9px; }
    .auth-layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: 1px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--line); }
    .auth-aside, .auth-form { background: var(--panel); padding: clamp(30px, 5vw, 62px); }
    .auth-aside { display: flex; flex-direction: column; justify-content: space-between; background: radial-gradient(circle at 20% 20%, #8f7cff27, transparent 40%), #11141a; }
    .form-stack { display: grid; gap: 17px; }
    .type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .type-card { padding: 24px; }
    .type-card h3 { margin: 25px 0 7px; font-size: 24px; letter-spacing: -.04em; }
    .stepper { display: flex; gap: 7px; margin: 21px 0 30px; }
    .step { flex: 1; height: 4px; border-radius: 9px; background: var(--line); }
    .step.done, .step.active { background: var(--brand); }

    .dash-head { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
    .dash-title h1 { margin: 5px 0 0; font-size: 36px; letter-spacing: -.05em; }
    .dash-tools { display: grid; grid-template-columns: minmax(220px, 1fr) auto auto; gap: 10px; margin-bottom: 17px; }
    .mode-switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: #0e1116; }
    .mode-btn { min-height: 33px; padding: 0 11px; color: var(--muted); font-size: 12px; }
    .mode-btn.active { color: white; background: var(--panel-3); }
    .project-grid { display: grid; grid-template-columns: repeat(3, minmax(230px, 1fr)); gap: 14px; }
    .project-card { overflow: hidden; text-align: left; padding: 0; }
    .project-preview { height: 145px; padding: 13px; border-bottom: 1px solid var(--line); background: radial-gradient(circle at 70% 20%, #8f7cff3b, transparent 34%), #171b23; }
    .project-card:nth-child(2) .project-preview { background: radial-gradient(circle at 20% 80%, #4fcfa13d, transparent 35%), #171b23; }
    .project-card:nth-child(3) .project-preview { background: radial-gradient(circle at 80% 60%, #f1bf633a, transparent 33%), #171b23; }
    .project-info { padding: 15px; }
    .project-info h3 { margin: 0 0 5px; font-size: 14px; }
    .project-stats { display: flex; gap: 13px; margin-top: 13px; color: var(--muted); font-size: 10px; }
    .project-table { width: 100%; border-collapse: collapse; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .project-table th, .project-table td { padding: 13px 15px; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; }
    .project-table th { color: var(--muted); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    .project-table tr:last-child td { border-bottom: 0; }
    .activity-layout { display: grid; grid-template-columns: .72fr 1.28fr; gap: 14px; }
    .activity-list, .recent-list { padding: 15px; }
    .activity-row { display: grid; grid-template-columns: auto 1fr auto; gap: 11px; align-items: start; padding: 13px 2px; border-bottom: 1px solid var(--line); font-size: 12px; }
    .activity-row:last-child { border-bottom: 0; }
    .activity-icon { display: grid; place-items: center; width: 27px; height: 27px; border-radius: 7px; color: var(--brand-2); background: var(--brand-wash); }
    .settings-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 0; }
    .settings-nav { display: grid; align-content: start; gap: 4px; padding: 10px; }
    .settings-nav .rail-btn {
      display: flex;
      width: 100%;
      min-height: 40px;
      padding: 0 11px;
      align-items: center;
      gap: 10px;
      border: 0;
      border-left: 2px solid transparent;
      border-radius: 0;
      color: var(--muted);
      background: transparent;
      font-size: 11px;
      text-align: left;
    }
    .settings-nav .rail-btn:hover,
    .settings-nav .rail-btn.active {
      border-left-color: var(--text);
      color: var(--text);
      background: var(--brand-wash);
    }
    .settings-nav .rail-icon { display: inline-grid; width: 20px; place-items: center; color: var(--soft); }
    .settings-panel { padding: 24px; border-left: 0; }
    .setting-row { display: flex; align-items: center; gap: 18px; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-copy { flex: 1; }
    .setting-copy b { display: block; margin-bottom: 4px; font-size: 13px; }
    .toggle { width: 38px; height: 22px; padding: 3px; border: 0; border-radius: 99px; background: var(--brand); }
    .toggle::after { content: ""; display: block; width: 16px; height: 16px; margin-left: auto; border-radius: 50%; background: white; }
    .recovery-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .recovery-card { padding: 20px; }

    /* Integrated canvas editor — Focus and Workbench are views over one editor state. */
    .shell-a.editor-host { height: 100vh; min-height: 0; overflow: hidden; }
    .editor-host .surface { height: calc(100vh - 52px); min-height: 0; }
    .editor-host .surface-inner { width: 100%; max-width: none; height: 100%; padding: 0; }
    .editor-workspace { height: 100%; min-width: 1120px; color: var(--text); background: var(--bg); }
    .editor-dots {
      background-color: var(--bg);
      background-image: radial-gradient(var(--line-strong) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .editor-tool,
    .editor-tab,
    .editor-command-button {
      min-height: 32px;
      border: 1px solid transparent;
      border-radius: 0;
      color: var(--muted);
      background: transparent;
      font-size: 10px;
    }
    .editor-tool:hover,
    .editor-tab:hover,
    .editor-command-button:hover { color: var(--text); border-color: var(--line); background: var(--brand-wash); }
    .editor-tool.active { color: var(--bg); border-color: var(--text); background: var(--text); }
    .editor-section-title { display: flex; height: 36px; padding: 0 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); color: var(--soft); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    .editor-tabs { display: flex; min-height: 38px; align-items: stretch; border-bottom: 1px solid var(--line); }
    .editor-tab { padding: 0 10px; border: 0; border-right: 1px solid var(--line); border-bottom: 2px solid transparent; }
    .editor-tab.active { color: var(--text); border-bottom-color: var(--text); background: var(--brand-wash); }
    .editor-node { display: flex; width: 100%; min-height: 28px; padding: 0 8px; align-items: center; gap: 7px; border: 0; color: var(--soft); background: transparent; font-size: 10px; text-align: left; }
    .editor-node:hover { background: var(--brand-wash); }
    .editor-node.selected { color: var(--text); background: var(--brand-wash); box-shadow: inset 2px 0 var(--text); }
    .editor-node .kind { width: 18px; color: var(--muted); text-align: center; }
    .editor-node.indent-1 { padding-left: 20px; }
    .editor-node.indent-2 { padding-left: 34px; }
    .editor-node.indent-3 { padding-left: 48px; }

    .editor-focus { position: relative; overflow: hidden; }
    .editor-command {
      position: absolute;
      z-index: 5;
      top: 16px;
      left: 50%;
      display: flex;
      width: min(430px, 38vw);
      height: 39px;
      padding: 0 11px;
      transform: translateX(-50%);
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line-strong);
      color: var(--muted);
      background: color-mix(in oklch, var(--panel) 92%, transparent);
      box-shadow: 0 18px 45px #0008;
      font-size: 10px;
    }
    .editor-command span:nth-child(2) { overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
    .editor-focus-rail {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 16px;
      display: flex;
      width: 48px;
      height: max-content;
      padding: 7px;
      flex-direction: column;
      gap: 5px;
      border: 1px solid var(--line-strong);
      background: color-mix(in oklch, var(--panel) 92%, transparent);
      box-shadow: 0 18px 45px #0007;
      transform: translateY(-50%);
    }
    .editor-focus-rail .editor-tool { width: 32px; height: 32px; padding: 0; }
    .editor-focus-rail > .spacer { min-height: 0; flex: 0; }
    .editor-stage { position: absolute; inset: 0; display: grid; padding: 62px 280px 330px 88px; place-items: center; overflow: auto; transition: padding 180ms ease; }
    .editor-focus-inspector {
      position: absolute;
      z-index: 4;
      top: 16px;
      right: 16px;
      bottom: 148px;
      width: 250px;
      overflow: auto;
      border: 1px solid var(--line-strong);
      background: color-mix(in oklch, var(--panel) 94%, transparent);
      box-shadow: 0 18px 45px #0007;
    }
    .editor-agent-chat { position: absolute; z-index: 8; display: grid; grid-template-rows: 43px minmax(0, 1fr) auto; overflow: hidden; border: 1px solid var(--line-strong); background: color-mix(in oklch, var(--panel) 97%, transparent); transition: inset 180ms ease, width 180ms ease, height 180ms ease; }
    .agent-float .editor-agent-chat { bottom: 16px; left: 78px; width: min(680px, calc(100% - 390px)); height: 300px; box-shadow: 0 18px 50px #0009; }
    .agent-left .editor-agent-chat { top: 0; bottom: 0; left: 0; width: 350px; }
    .agent-right .editor-agent-chat { top: 0; right: 0; bottom: 0; width: 350px; }
    .agent-left .editor-focus-rail { left: 366px; }
    .agent-left .editor-stage { padding: 62px 280px 40px 420px; }
    .agent-left .editor-command { left: 62%; }
    .agent-right .editor-focus-inspector { right: 366px; }
    .agent-right .editor-stage { padding: 62px 640px 40px 88px; }
    .agent-right .editor-command { left: 30%; }
    .agent-chat-head { display: flex; padding: 0 9px 0 12px; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .agent-chat-title { min-width: 0; flex: 1; }
    .agent-chat-title strong { display: block; overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .agent-chat-title span { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; }
    .agent-placement { display: flex; border: 1px solid var(--line); }
    .agent-placement button { width: 34px; height: 27px; padding: 0; border: 0; border-right: 1px solid var(--line); color: var(--muted); background: var(--bg); font-size: 8px; }
    .agent-placement button:last-child { border-right: 0; }
    .agent-placement button:hover { color: var(--text); background: var(--brand-wash); }
    .agent-placement button.active { color: var(--bg); background: var(--text); }
    .agent-chat-body { display: flex; padding: 11px 12px; flex-direction: column; gap: 9px; overflow: auto; }
    .agent-message { max-width: 92%; font-size: 9px; line-height: 1.55; }

    }
    function prototypeTools() {
      return `<div class="prototype-tools"><label for="screen-jump">Prototype journey</label><select id="screen-jump" data-screen-jump>${screens.map(([id,label])=>`<option value="${id}" ${state.screen === id ? 'selected' : ''}>${label}</option>`).join('')}</select></div>`;
    }
    function welcomeSwitcher(variant) {
      return `<div class="prototype-switcher"><button data-cycle="-1" aria-label="Previous welcome direction">←</button><div class="variant-label">Welcome ${variant.key} · ${variant.name}</div><button data-cycle="1" aria-label="Next welcome direction">→</button></div>`;
    }
    function statePeek() {
      return `<details class="state-peek"><summary>Prototype state</summary><pre>${JSON.stringify(state, null, 2)}</pre></details>`;
    }
    function render() {
      const welcomeVariant = currentWelcomeVariant();
      const page = content();
      const standalone = ['welcome','accounts','account-type','local-create','local-login','cloud-login','cloud-onboarding'].includes(state.screen);
      const renderedPage = standalone ? `<div class="app standalone-app">${standaloneTitlebar()}<div class="standalone-window-content">${page}</div></div>` : shellA(page);
      const variantControl = state.screen === 'welcome' ? welcomeSwitcher(welcomeVariant) : '';
      document.getElementById('app').innerHTML = renderedPage + prototypeTools() + variantControl + statePeek();
      document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', event => { const identity = event.currentTarget.dataset.identity; if (identity) state.selectedIdentity = identity; go(event.currentTarget.dataset.go); }));
      document.querySelector('[data-back]')?.addEventListener('click', goBack);
      document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', event => { state.dashboardMode = event.currentTarget.dataset.mode; setUrl({ mode: state.dashboardMode }); render(); }));
      document.querySelectorAll('[data-editor-mode]').forEach(el => el.addEventListener('click', event => { state.editorMode = event.currentTarget.dataset.editorMode; setUrl({ editorMode: state.editorMode }); render(); }));
      document.querySelectorAll('[data-editor-view]').forEach(el => el.addEventListener('click', event => { state.editorView = event.currentTarget.dataset.editorView; state.modelMenuOpen = false; state.assetMenuOpen = false; state.canvasContextPicking = false; setUrl({ editorView: state.editorView }); render(); }));
      document.querySelectorAll('[data-editor-profile]').forEach(el => el.addEventListener('change', event => { state.editorProfile = event.currentTarget.value; state.editorOrientation = naturalOrientation(state.editorProfile); setUrl({ profile: state.editorProfile, orientation: state.editorOrientation }); render(); }));
      document.querySelectorAll('[data-editor-orientation]').forEach(el => el.addEventListener('click', event => { state.editorOrientation = event.currentTarget.dataset.editorOrientation; setUrl({ orientation: state.editorOrientation }); render(); }));
      document.querySelectorAll('[data-agent-placement]').forEach(el => el.addEventListener('click', event => { state.agentPlacement = event.currentTarget.dataset.agentPlacement; state.moreOpen = false; state.modelMenuOpen = false; state.assetMenuOpen = false; state.canvasContextPicking = false; setUrl({ agentPanel: state.agentPlacement }); render(); }));
      document.querySelectorAll('[data-model-menu]').forEach(el => el.addEventListener('click', () => { state.modelMenuOpen = !state.modelMenuOpen; state.assetMenuOpen = false; state.canvasContextPicking = false; state.moreOpen = false; render(); document.querySelector('[data-model-search]')?.focus(); }));
      document.querySelectorAll('[data-agent-model-option]').forEach(el => el.addEventListener('click', event => { state.agentModel = event.currentTarget.dataset.agentModelOption; state.modelMenuOpen = false; setUrl({ model: state.agentModel }); render(); }));
      document.querySelectorAll('[data-model-provider]').forEach(el => el.addEventListener('click', event => { state.modelProviderFilter = event.currentTarget.dataset.modelProvider; render(); document.querySelector('[data-model-search]')?.focus(); }));
      document.querySelectorAll('[data-agent-effort]').forEach(el => el.addEventListener('click', event => { state.agentEffort = event.currentTarget.dataset.agentEffort; setUrl({ effort: state.agentEffort }); render(); document.querySelector('[data-model-search]')?.focus(); }));
      document.querySelector('[data-model-search]')?.addEventListener('input', event => { state.modelQuery = event.target.value; const position = event.target.selectionStart; render(); const next = document.querySelector('[data-model-search]'); next?.focus(); next?.setSelectionRange(position, position); });
      document.querySelectorAll('[data-asset-menu]').forEach(el => el.addEventListener('click', () => { state.assetMenuOpen = !state.assetMenuOpen; state.modelMenuOpen = false; state.canvasContextPicking = false; state.moreOpen = false; render(); document.querySelector(state.assetSource === 'upload' ? '[data-open-file-picker]' : '[data-asset-search]')?.focus(); }));
      document.querySelectorAll('[data-canvas-context-picker]').forEach(el => el.addEventListener('click', () => { state.canvasContextPicking = !state.canvasContextPicking; state.assetMenuOpen = false; state.modelMenuOpen = false; state.moreOpen = false; render(); }));
      document.querySelectorAll('[data-asset-source]').forEach(el => el.addEventListener('click', event => { state.assetSource = event.currentTarget.dataset.assetSource; state.assetQuery = ''; render(); document.querySelector(state.assetSource === 'upload' ? '[data-open-file-picker]' : state.assetSource === 'url' ? '[data-asset-url]' : '[data-asset-search]')?.focus(); }));
      document.querySelector('[data-asset-search]')?.addEventListener('input', event => { state.assetQuery = event.target.value; const position = event.target.selectionStart; render(); const next = document.querySelector('[data-asset-search]'); next?.focus(); next?.setSelectionRange(position, position); });
      document.querySelectorAll('[data-context-asset]').forEach(el => el.addEventListener('click', event => { const asset = contextAssets[event.currentTarget.dataset.contextAsset]; if (asset) attachContextItem(asset); state.assetMenuOpen = false; render(); }));
      document.querySelectorAll('[data-remove-context]').forEach(el => el.addEventListener('click', event => { state.attachedContext = state.attachedContext.filter(item => item.id !== event.currentTarget.dataset.removeContext); render(); }));
      document.querySelectorAll('[data-open-file-picker]').forEach(el => el.addEventListener('click', () => document.querySelector('[data-file-input]')?.click()));
      document.querySelector('[data-file-input]')?.addEventListener('change', event => attachFiles(event.target.files));
      document.querySelector('[data-asset-url]')?.addEventListener('input', event => { state.assetUrl = event.target.value; });
      document.querySelector('[data-add-url]')?.addEventListener('click', () => { const url = state.assetUrl.trim(); if (!url) return; attachContextItem({ id: `url-${url}`, label: url.replace(/^https?:\/\//, '').slice(0, 42), type: 'url', source: 'url', sourceLabel: 'URL', detail: 'External reference' }); state.assetUrl = ''; state.assetMenuOpen = false; render(); });
      document.querySelector('[data-agent-voice]')?.addEventListener('click', () => { state.voiceActive = !state.voiceActive; render(); });
      document.querySelector('[data-editor-menu]')?.addEventListener('click', () => { state.moreOpen = !state.moreOpen; state.modelMenuOpen = false; state.assetMenuOpen = false; render(); });
      document.querySelectorAll('[data-editor-action]').forEach(el => el.addEventListener('click', event => { state.lastEditorAction = event.currentTarget.dataset.editorAction; state.moreOpen = false; render(); }));
      document.querySelectorAll('[data-canvas-context]').forEach(el => el.addEventListener('click', event => {
        if (!state.canvasContextPicking) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        const node = event.currentTarget;
        attachContextItem({ id: `canvas-${node.dataset.canvasContext}`, label: node.dataset.contextLabel, type: node.dataset.contextKind || 'node', source: 'canvas', sourceLabel: 'Canvas selection', detail: node.dataset.contextDetail || node.dataset.canvasContext });
        if (node.dataset.editorSelect) state.editorSelected = node.dataset.editorSelect;
        state.canvasContextPicking = false;
        render();
      }));
      document.querySelectorAll('[data-editor-select]').forEach(el => el.addEventListener('click', event => { state.editorSelected = event.currentTarget.dataset.editorSelect; render(); }));
      document.querySelectorAll('[data-editor-zoom]').forEach(el => el.addEventListener('click', event => { state.editorZoom = Math.max(25, Math.min(200, state.editorZoom + Number(event.currentTarget.dataset.editorZoom))); render(); }));
      document.querySelectorAll('[data-agent]').forEach(el => el.addEventListener('click', () => { state.agent = state.agent === 'applying' ? 'cancelled' : 'applying'; render(); }));
      document.querySelectorAll('[data-window-action]').forEach(el => el.addEventListener('click', event => { state.windowAction = event.currentTarget.dataset.windowAction; render(); }));
      document.querySelectorAll('[data-cycle]').forEach(el => el.addEventListener('click', event => cycle(Number(event.currentTarget.dataset.cycle))));
      document.querySelector('[data-screen-jump]')?.addEventListener('change', event => go(event.target.value));
      document.querySelector('[data-search]')?.addEventListener('input', event => { state.search = event.target.value; const position = event.target.selectionStart; render(); const next = document.querySelector('[data-search]'); next?.focus(); next?.setSelectionRange(position, position); });
      document.querySelector('[data-remember]')?.addEventListener('change', event => { state.remembered = event.target.checked; });
      document.querySelector('[data-auth-form]')?.addEventListener('submit', event => { event.preventDefault(); go('dashboard'); });
      document.querySelector('[data-agent-form]')?.addEventListener('submit', event => event.preventDefault());
      document.querySelectorAll('.agent-chat-composer, [data-asset-dropzone]').forEach(target => {
        target.addEventListener('dragenter', event => { event.preventDefault(); event.stopPropagation(); target.classList.add('drag-active'); });
        target.addEventListener('dragover', event => { event.preventDefault(); event.stopPropagation(); target.classList.add('drag-active'); });
        target.addEventListener('dragleave', event => { event.preventDefault(); event.stopPropagation(); if (!target.contains(event.relatedTarget)) target.classList.remove('drag-active'); });
        target.addEventListener('drop', event => { event.preventDefault(); event.stopPropagation(); target.classList.remove('drag-active'); if (event.dataTransfer?.files?.length) attachFiles(event.dataTransfer.files); });
      });
      document.querySelector('[data-cloud-next]')?.addEventListener('click', () => { if (state.cloudStep < 3) { state.cloudStep += 1; render(); } else go('dashboard'); });
      document.querySelector('[data-cloud-back]')?.addEventListener('click', () => { if (state.cloudStep > 0) { state.cloudStep -= 1; render(); } else go('account-type'); });
      document.querySelectorAll('[data-open-project]').forEach(el => el.addEventListener('click', () => go('editor')));
    }
    function cycle(delta) {
      if (state.screen !== 'welcome') return;
      const current = welcomeVariants.findIndex(item => item.key === currentWelcomeVariant().key);
      const next = welcomeVariants[(current + delta + welcomeVariants.length) % welcomeVariants.length];
      setUrl({ variant: next.key }); render();
    }
    addEventListener('keydown', event => {
      const active = document.activeElement;
      if (event.key === 'Escape' && (state.modelMenuOpen || state.assetMenuOpen || state.canvasContextPicking)) { state.modelMenuOpen = false; state.assetMenuOpen = false; state.canvasContextPicking = false; render(); return; }
      if (active && (['INPUT','TEXTAREA','SELECT'].includes(active.tagName) || active.isContentEditable)) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    addEventListener('popstate', () => {
      const params = new URLSearchParams(location.search);
      state.screen = params.get('screen') || 'welcome';
      state.dashboardMode = params.get('mode') || 'grid';
      state.editorView = params.get('editorView') || 'focus';
      state.editorMode = params.get('editorMode') || 'design';
      state.editorProfile = params.get('profile') || 'desktop';
      state.editorOrientation = params.get('orientation') || naturalOrientation(state.editorProfile);
      state.agentPlacement = params.get('agentPanel') || 'float';
      state.agentModel = params.get('model') || 'gpt-5.6';
      state.agentEffort = params.get('effort') || 'high';
      state.modelMenuOpen = false;
      state.assetMenuOpen = false;
      render();
    });
    render();
  </script>
</body>
</html>
