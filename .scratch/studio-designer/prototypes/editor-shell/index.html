<!doctype html>
<!-- Three variants of the Studio Designer editor shell, switchable via ?variant=, on one throwaway route. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio Designer — editor shell prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #111419;
      --panel-2: #171b21;
      --panel-3: #1d222a;
      --line: #292f39;
      --muted: #8993a3;
      --text: #eef1f6;
      --brand: #8d7cff;
      --brand-2: #b9adff;
      --green: #45d49d;
      --amber: #ffbe5c;
      --blue: #62a9ff;
      --danger: #ff6f7d;
      --radius: 10px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 1120px; min-height: 720px; background: var(--bg); color: var(--text); overflow: hidden; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { height: 100vh; }
    .icon-button, .tool, .mode-button, .quiet-button, .primary-button {
      border: 1px solid transparent; background: transparent; border-radius: 8px; min-height: 32px;
    }
    .icon-button:hover, .tool:hover, .mode-button:hover, .quiet-button:hover { background: #ffffff0d; border-color: var(--line); }
    .primary-button { background: var(--brand); color: white; padding: 0 13px; font-weight: 700; }
    .primary-button:hover { background: #9d8eff; }
    .quiet-button { border-color: var(--line); padding: 0 11px; background: #ffffff05; }
    .toolbar-group { display: flex; align-items: center; gap: 6px; }
    .logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 900; background: linear-gradient(135deg, #9a87ff, #5f4ce0); box-shadow: inset 0 0 0 1px #ffffff38; }
    .eyebrow { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .11em; }
    .small { color: var(--muted); font-size: 11px; }
    .label { font-size: 12px; font-weight: 700; }
    .badge { border: 1px solid var(--line); background: #ffffff09; border-radius: 999px; padding: 3px 7px; font-size: 10px; color: #cbd2dd; }
    .badge.green { color: #aaf4d6; border-color: #45d49d55; background: #45d49d16; }
    .badge.amber { color: #ffe0a6; border-color: #ffbe5c55; background: #ffbe5c16; }
    .divider { width: 1px; height: 20px; background: var(--line); }
    .section-title { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #abb3c0; }
    .select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; height: 30px; padding: 0 28px 0 9px; font-size: 11px; }
    .node-row { display: flex; align-items: center; gap: 7px; min-height: 28px; padding: 3px 8px; font-size: 11px; border-radius: 6px; color: #c7ced9; }
    .node-row:hover { background: #ffffff08; }
    .node-row.selected { background: #8d7cff1f; color: white; box-shadow: inset 2px 0 var(--brand); }
    .node-row .kind { width: 18px; text-align: center; color: #8f9bad; }
    .indent-1 { margin-left: 13px; } .indent-2 { margin-left: 27px; } .indent-3 { margin-left: 41px; }
    .canvas-grid { background-color: #09090b; background-image: radial-gradient(#27272a 1px, transparent 1px); background-size: 24px 24px; }
    .device-frame { position: relative; margin: auto; width: min(720px, 82%); aspect-ratio: 16/10; border-radius: 13px; border: 1px solid #3a424e; background: #f7f5f0; color: #17191d; box-shadow: 0 28px 70px #00000070, 0 0 0 6px #14181e; overflow: hidden; }
    .device-frame.phone { width: 292px; aspect-ratio: 390/844; }
    .device-frame.foldable { width: 390px; aspect-ratio: 673/841; }
    .device-frame.tablet { width: 510px; aspect-ratio: 834/1112; }
    .pos-shell { height: 100%; display: grid; grid-template-columns: 58px 1fr; background: #f2f1ed; font-family: Inter, sans-serif; }
    .pos-nav { background: #1e2024; color: white; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 17px; }
    .pos-nav .mini-logo { width: 29px; height: 29px; border-radius: 9px; display: grid; place-items: center; background: #7665f2; font-size: 10px; font-weight: 900; }
    .nav-dot { width: 25px; height: 25px; border-radius: 7px; display: grid; place-items: center; color: #a8acb5; font-size: 11px; }
    .nav-dot.active { background: #7665f2; color: white; }
    .pos-main { padding: 17px; overflow: hidden; }
    .pos-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .pos-head h2 { font-size: 17px; margin: 0; }
    .search-mock { width: 34%; height: 26px; border-radius: 7px; background: white; border: 1px solid #dedcd6; color: #92908b; font-size: 8px; display: flex; align-items: center; padding: 0 9px; }
    .food-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .food-card { position: relative; border-radius: 10px; background: white; border: 1px solid #e1dfd8; padding: 7px; box-shadow: 0 4px 10px #1d1b1609; }
    .food-img { height: 58px; border-radius: 7px; background: linear-gradient(145deg, #ce7a48, #6e3323); }
    .food-card:nth-child(2) .food-img { background: linear-gradient(145deg, #edc369, #8e5428); }
    .food-card:nth-child(3) .food-img { background: linear-gradient(145deg, #77a65c, #305f3c); }
    .sale-chip { position: absolute; top: 12px; right: 12px; background: #ffcf4c; color: #4b3700; padding: 3px 6px; border-radius: 999px; font-size: 6px; font-weight: 900; box-shadow: 0 2px 5px #0003; }
    .food-name { margin-top: 6px; font-size: 8px; font-weight: 800; }
    .food-meta { display: flex; justify-content: space-between; margin-top: 3px; font-size: 6px; color: #817f79; }
    .selection-outline { position: absolute; inset: 5px; border: 2px solid #7665f2; border-radius: 10px; pointer-events: none; }
    .selection-label { position: absolute; top: 2px; left: 7px; transform: translateY(-100%); background: #7665f2; color: white; font-size: 7px; padding: 2px 5px; border-radius: 4px 4px 0 0; }
    .inspector-section { border-bottom: 1px solid var(--line); padding: 11px; }
    .inspector-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .field-grid { display: grid; grid-template-columns: 72px 1fr; gap: 7px 8px; align-items: center; font-size: 11px; }
    .field-grid .field-label { color: var(--muted); }
    .field { min-height: 28px; border: 1px solid var(--line); background: #0d1014; border-radius: 6px; padding: 6px 8px; color: #d9dee7; }
    .token-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--brand); }
    .tab-strip { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 6px; min-height: 38px; }
    .tab { border: 0; background: transparent; color: var(--muted); padding: 9px 8px 8px; border-bottom: 2px solid transparent; font-size: 11px; }
    .tab.active { color: white; border-bottom-color: var(--brand); }
    .agent-entry { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: start; padding: 9px 10px; border-bottom: 1px solid var(--line); font-size: 11px; }
    .agent-avatar { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #8d7cff, #56b9ff); display: grid; place-items: center; font-size: 9px; font-weight: 900; }
    .op-list { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; }
    .op { border-radius: 4px; background: #45d49d16; color: #89e8c3; border: 1px solid #45d49d33; padding: 2px 5px; font-size: 9px; }
    .activity-line { height: 3px; border-radius: 99px; background: #29303a; overflow: hidden; margin-top: 7px; }
    .activity-line > span { display: block; width: 68%; height: 100%; background: linear-gradient(90deg, var(--brand), var(--blue)); }
    .history-row { display: flex; gap: 8px; align-items: center; padding: 7px 10px; font-size: 10px; color: #c2c9d4; }
    .history-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .prototype-switcher { position: fixed; z-index: 1000; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 7px; border-radius: 999px; background: #f4f5f7; color: #17191d; box-shadow: 0 10px 35px #0009; border: 1px solid white; }
    .prototype-switcher button { border: 0; width: 32px; height: 32px; border-radius: 50%; color: #17191d; background: #e3e5e9; font-weight: 900; }
    .prototype-switcher button:hover { background: #d4d7dd; }
    .variant-label { min-width: 184px; text-align: center; font-size: 11px; font-weight: 800; }
    .state-peek { position: fixed; z-index: 900; right: 12px; bottom: 13px; max-width: 310px; border: 1px solid var(--line); background: #0a0c0fef; border-radius: 9px; font-size: 10px; color: #aab4c3; }
    .state-peek summary { padding: 7px 9px; cursor: pointer; }
    .state-peek pre { margin: 0; border-top: 1px solid var(--line); padding: 8px; white-space: pre-wrap; }

    /* Variant A — persistent four-pane workbench */
    .variant-a { height: 100vh; display: grid; grid-template: 48px 1fr 28px / 48px 226px minmax(520px, 1fr) 292px; }
    .a-topbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid var(--line); background: #101318; }
    .a-rail { grid-row: 2; background: #0d1014; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 7px; }
    .a-rail .tool { width: 34px; height: 34px; color: #9ca6b5; }
    .a-rail .tool.active { color: white; background: #8d7cff25; border-color: #8d7cff45; }
    .a-explorer { grid-column: 2; grid-row: 2; border-right: 1px solid var(--line); background: var(--panel); overflow: hidden; display: grid; grid-template-rows: 38px 1fr 190px; }
    .a-tree { overflow: auto; padding: 5px; }
    .a-library { border-top: 1px solid var(--line); overflow: hidden; }
    .asset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; }
    .asset-tile { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 7px; background: linear-gradient(145deg, #633d2f, #201712); position: relative; }
    .asset-tile:nth-child(2) { background: linear-gradient(145deg, #806229, #2b2212); }
    .asset-tile:nth-child(3) { background: linear-gradient(145deg, #496a43, #142217); }
    .asset-tile span { position: absolute; inset: auto 4px 4px; font-size: 7px; color: white; }
    .a-stage { grid-column: 3; grid-row: 2; min-width: 0; display: grid; grid-template-rows: 38px 1fr 136px; }
    .stage-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 0 9px; border-bottom: 1px solid var(--line); background: #111419; }
    .stage-area { overflow: auto; padding: 46px 28px; display: grid; place-items: center; }
    .a-activity { border-top: 1px solid var(--line); background: #101318; display: grid; grid-template-columns: 1fr 230px; overflow: hidden; }
    .a-inspector { grid-column: 4; grid-row: 2; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; }
    .a-status { grid-column: 1/-1; grid-row: 3; display: flex; align-items: center; justify-content: space-between; padding: 0 9px; background: #7665f2; color: #f7f5ff; font-size: 10px; }

    /* Variant B — canvas-first focus studio */
    .variant-b { height: 100vh; display: grid; grid-template-rows: 58px 1fr; background: #0b0d10; }
    .b-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); background: #0e1116; }
    .b-workspace { position: relative; overflow: hidden; }
    .b-stage { position: absolute; inset: 0; display: grid; place-items: center; padding: 60px 260px 170px 110px; }
    .b-rail { position: absolute; left: 14px; top: 16px; width: 54px; padding: 8px; border: 1px solid var(--line); background: #15191fe8; backdrop-filter: blur(14px); border-radius: 14px; display: flex; flex-direction: column; gap: 7px; box-shadow: 0 18px 50px #0007; }
    .b-rail .tool { height: 38px; color: #9ca6b5; }
    .b-rail .tool.active { color: white; background: var(--brand); }
    .b-context { position: absolute; right: 16px; top: 16px; width: 240px; max-height: calc(100% - 190px); overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: #15191fe8; backdrop-filter: blur(14px); box-shadow: 0 18px 50px #0007; }
    .b-command { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); width: 400px; height: 40px; border: 1px solid #3a414d; border-radius: 12px; background: #161a20ed; color: #aab3c1; display: flex; align-items: center; gap: 9px; padding: 0 12px; box-shadow: 0 15px 35px #0006; font-size: 11px; }
    .b-dock { position: absolute; left: 86px; right: 16px; bottom: 18px; height: 132px; display: grid; grid-template-columns: 1fr 310px; border: 1px solid var(--line); background: #12161ced; backdrop-filter: blur(16px); border-radius: 16px; box-shadow: 0 20px 60px #0009; overflow: hidden; }
    .b-agent { padding: 12px 14px; border-right: 1px solid var(--line); }
    .b-history { padding: 10px; overflow: hidden; }
    .floating-frame-label { position: absolute; top: -31px; left: 0; color: #b9c1cc; font-size: 10px; display: flex; gap: 7px; align-items: center; }

    /* Variant C — flow-oriented authoring deck */
    .variant-c { height: 100vh; display: grid; grid-template: 54px 1fr / 264px minmax(500px, 1fr) 348px; }
    .c-topbar { grid-column: 1/-1; display: grid; grid-template-columns: 264px 1fr 348px; align-items: center; border-bottom: 1px solid var(--line); background: #111419; }
    .c-topbar > div { padding: 0 12px; display: flex; align-items: center; gap: 8px; }
    .c-flow { grid-column: 1; grid-row: 2; background: #101318; border-right: 1px solid var(--line); display: grid; grid-template-rows: 40px 1fr 188px; overflow: hidden; }
    .journey { padding: 10px; overflow: auto; }
    .screen-card { border: 1px solid var(--line); border-radius: 9px; padding: 8px; margin-bottom: 10px; background: #15191f; }
    .screen-card.active { border-color: #8d7cff7a; box-shadow: inset 0 0 0 1px #8d7cff35; }
    .screen-thumb { height: 64px; border-radius: 6px; background: #f2f1ed; display: grid; grid-template-columns: 12px 1fr; overflow: hidden; margin-bottom: 7px; }
    .screen-thumb:before { content: ''; background: #22252a; }
    .screen-thumb:after { content: ''; margin: 8px; border-radius: 3px; background: linear-gradient(135deg, #d4a168, #6b3b28); }
    .flow-arrow { height: 14px; margin: -7px 0 3px 24px; border-left: 1px dashed #586272; }
    .c-library { border-top: 1px solid var(--line); }
    .c-stage { grid-column: 2; grid-row: 2; min-width: 0; display: grid; grid-template-rows: 42px 1fr; }
    .c-canvas { padding: 44px 32px; overflow: auto; display: grid; place-items: center; }
    .c-deck { grid-column: 3; grid-row: 2; border-left: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: 40px 1fr 168px; overflow: hidden; }
    .deck-body { overflow: auto; }
    .build-card { margin: 10px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: #0d1014; }
    .build-step { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid #20252d; font-size: 10px; }
    .build-step:last-child { border: 0; }
  </style>
</head>
<body>
  <div id="app" class="app"></div>
  <script>
    const variants = [
      { key: 'A', name: 'Persistent Workbench' },
      { key: 'B', name: 'Canvas-first Focus Studio' },
      { key: 'C', name: 'Flow-oriented Deck' }
    ];
    const state = {
      selected: 'sale-badge',
      profile: 'desktop',
      mode: 'design',
      agent: 'applying',
      history: 18,
      sync: 'saved',
      zoom: 82
    };
    const profileLabels = { phone: 'Phone · 390×844', foldable: 'Foldable · 673×841', tablet: 'Tablet · 834×1112', laptop: 'Laptop · 1280×800', desktop: 'Desktop · 1440×1024', ultrawide: 'Ultrawide · 2560×1080', television: 'Television · 1920×1080', '4k': '4K · 3840×2160' };
    function currentVariant() {
      const key = new URLSearchParams(location.search).get('variant') || 'A';
      return variants.find(v => v.key === key) || variants[0];
    }
    function profileOptions() {
      return Object.entries(profileLabels).map(([value, label]) => `<option value="${value}" ${state.profile === value ? 'selected' : ''}>${label}</option>`).join('');
    }
    function foodFrame() {
      const compact = ['phone', 'foldable', 'tablet'].includes(state.profile);
      return `<div style="position:relative" class="device-frame ${compact ? state.profile : ''}">
        <div class="floating-frame-label"><span>${profileLabels[state.profile]}</span><span class="badge">${state.zoom}%</span></div>
        <div class="pos-shell">
          <aside class="pos-nav"><div class="mini-logo">S</div><div class="nav-dot active">⌂</div><div class="nav-dot">▦</div><div class="nav-dot">◎</div><div class="nav-dot">⚙</div></aside>
          <main class="pos-main">
            <div class="pos-head"><div><div style="font-size:7px;color:#85827a">Studio Market</div><h2>Popular dishes</h2></div><div class="search-mock">⌕ Search menu</div></div>
            <div class="food-grid">
              <div class="food-card" data-select="sale-badge"><div class="food-img"></div><span class="sale-chip">SALE</span><div class="food-name">Wagyu bowl</div><div class="food-meta"><span>Main course</span><b>$18.00</b></div>${state.selected === 'sale-badge' ? '<div class="selection-outline"><span class="selection-label">Badge · sale-badge</span></div>' : ''}</div>
              <div class="food-card" data-select="product-card"><div class="food-img"></div><div class="food-name">Chicken ramen</div><div class="food-meta"><span>Noodles</span><b>$14.50</b></div>${state.selected === 'product-card' ? '<div class="selection-outline"><span class="selection-label">Card · product-card</span></div>' : ''}</div>
              <div class="food-card"><div class="food-img"></div><div class="food-name">Veggie salad</div><div class="food-meta"><span>Fresh</span><b>$11.00</b></div></div>
            </div>
          </main>
        </div>
      </div>`;
    }
    function tree() {
      return `<div class="node-row"><span class="kind">▾</span><b>Catalog</b></div>
        <div class="node-row indent-1"><span class="kind">▾</span>Scaffold</div>
        <div class="node-row indent-2"><span class="kind">▾</span>Stack</div>
        <div class="node-row indent-3"><span class="kind">▧</span>Image</div>
        <div class="node-row indent-3 ${state.selected === 'sale-badge' ? 'selected' : ''}" data-select="sale-badge"><span class="kind">●</span>Badge · SALE</div>
        <div class="node-row indent-2"><span class="kind">▾</span>Grid · products</div>
        <div class="node-row indent-3 ${state.selected === 'product-card' ? 'selected' : ''}" data-select="product-card"><span class="kind">◇</span>Card · Product</div>
        <div class="node-row indent-3"><span class="kind">T</span>Text · Name</div>
        <div class="node-row indent-3"><span class="kind">＋</span>Button · Add</div>`;
    }
    function inspector() {
      const badge = state.selected === 'sale-badge';
      const layout = badge
        ? `<div class="inspector-section"><div class="inspector-head"><span class="label">Layout</span><span class="small">Stack child</span></div><div class="field-grid"><span class="field-label">Position</span><div class="field">Overlay</div><span class="field-label">Anchor</span><div class="field">Top · Right</div><span class="field-label">Offset</span><div class="field">8 × 8</div></div></div>`
        : `<div class="inspector-section"><div class="inspector-head"><span class="label">Layout</span><span class="small">Grid child</span></div><div class="field-grid"><span class="field-label">Direction</span><div class="field">Vertical</div><span class="field-label">Gap</span><div class="field">space.2</div><span class="field-label">Padding</span><div class="field">space.3</div></div></div>`;
      const appearance = badge
        ? `<div class="inspector-section"><div class="inspector-head"><span class="label">Appearance</span><span class="small">3 tokens</span></div><div class="field-grid"><span class="field-label">Fill</span><div class="field"><span class="token-dot" style="background:#ffcf4c"></span>sale.surface</div><span class="field-label">Text</span><div class="field">SALE</div><span class="field-label">Radius</span><div class="field">radius.full</div></div></div>`
        : `<div class="inspector-section"><div class="inspector-head"><span class="label">Appearance</span><span class="small">3 tokens</span></div><div class="field-grid"><span class="field-label">Fill</span><div class="field"><span class="token-dot" style="background:#f5f3ef"></span>surface.card</div><span class="field-label">Border</span><div class="field">border.subtle</div><span class="field-label">Radius</span><div class="field">radius.lg</div></div></div>`;
      const behavior = badge
        ? `<div class="inspector-section"><div class="inspector-head"><span class="label">Interaction</span><button class="icon-button">＋</button></div><div class="field">Press → setVariable(promoOpen, true)</div></div>`
        : `<div class="inspector-section"><div class="inspector-head"><span class="label">Content binding</span><button class="icon-button">＋</button></div><div class="field">catalog.products · item</div></div>`;
      return `<div class="inspector-section"><div class="inspector-head"><div><div class="eyebrow">Selected</div><div class="label">${badge ? 'Badge · sale-badge' : 'Card · product-card'}</div></div><span class="badge green">Runtime valid</span></div>
        <div class="field-grid"><span class="field-label">Kind</span><div class="field">${badge ? 'Badge' : 'Card'}</div><span class="field-label">ID</span><div class="field">${state.selected}</div></div></div>
        ${layout}${appearance}
        <div class="inspector-section"><div class="inspector-head"><span class="label">Responsive</span><span class="badge">8 profiles</span></div><div class="small">${badge ? 'Base properties apply everywhere. Foldable overrides the offset to 6 × 6.' : 'The card fills its grid track. Phone switches the parent grid to one column.'}</div></div>
        ${behavior}`;
    }
    function agentActivity() {
      return `<div class="agent-entry"><div class="agent-avatar">AI</div><div><b>Improving promotional treatment</b><div class="small">Applying one validated undo group to Catalog</div><div class="op-list"><span class="op">MoveNode</span><span class="op">SetProperty</span><span class="op">SetToken</span></div><div class="activity-line"><span></span></div></div><span class="badge green">Live</span></div>`;
    }
    function historyRows() {
      return `<div class="history-row"><span class="history-dot"></span><span><b>Agent run</b> · 3 operations</span><span class="small" style="margin-left:auto">now</span></div><div class="history-row"><span class="history-dot" style="background:#7f8a99"></span><span>Changed product grid gap</span><span class="small" style="margin-left:auto">2m</span></div><div class="history-row"><span class="history-dot" style="background:#7f8a99"></span><span>Bound catalog.products</span><span class="small" style="margin-left:auto">8m</span></div>`;
    }
    function topbarCore() {
      return `<div class="toolbar-group"><div class="logo">S</div><div><div class="label">Studio Market</div><div class="small">POS Desktop · main</div></div></div>`;
    }
    function variantA() {
      return `<div class="variant-a">
        <header class="a-topbar">${topbarCore()}<div class="toolbar-group"><button class="mode-button">Design</button><button class="mode-button">Prototype</button><button class="mode-button">Data</button><div class="divider"></div><select class="select" data-profile>${profileOptions()}</select><button class="quiet-button">▶ Preview</button><button class="primary-button">Build .studio</button></div><div class="toolbar-group"><span class="badge green">● Cloud saved</span><button class="icon-button">↶</button><button class="icon-button">↷</button><button class="icon-button">•••</button></div></header>
        <nav class="a-rail"><button class="tool active">⌘</button><button class="tool">◇</button><button class="tool">▦</button><button class="tool">↯</button><button class="tool">AI</button><div style="flex:1"></div><button class="tool">⚙</button></nav>
        <aside class="a-explorer"><div class="section-title"><span>Project</span><button class="icon-button">＋</button></div><div class="a-tree"><div class="eyebrow" style="padding:7px">Screens</div><div class="node-row"><span class="kind">▣</span>Catalog</div><div class="node-row"><span class="kind">□</span>Product detail</div><div class="node-row"><span class="kind">□</span>Cart</div><div class="node-row"><span class="kind">□</span>Checkout</div><div class="eyebrow" style="padding:12px 7px 5px">Layers</div>${tree()}</div><div class="a-library"><div class="section-title"><span>Studio Library</span><span class="badge">12 assets</span></div><div class="asset-grid"><div class="asset-tile"><span>wagyu.webp</span></div><div class="asset-tile"><span>ramen.webp</span></div><div class="asset-tile"><span>salad.webp</span></div></div></div></aside>
        <main class="a-stage"><div class="stage-toolbar"><div class="toolbar-group"><button class="tool">↖</button><button class="tool">□</button><button class="tool">T</button><button class="tool">◎</button><div class="divider"></div><span class="small">Catalog / ${state.selected}</span></div><div class="toolbar-group"><button class="icon-button">−</button><span class="small">${state.zoom}%</span><button class="icon-button">＋</button><button class="icon-button">⌗</button></div></div><div class="stage-area canvas-grid">${foodFrame()}</div><div class="a-activity"><div><div class="tab-strip"><button class="tab active">Agent activity</button><button class="tab">Diagnostics <span class="badge">2</span></button><button class="tab">Interactions</button></div>${agentActivity()}</div><div style="border-left:1px solid var(--line)"><div class="section-title"><span>History</span><button class="icon-button">↶</button></div>${historyRows()}</div></div></main>
        <aside class="a-inspector"><div class="tab-strip"><button class="tab active">Inspect</button><button class="tab">Bind</button><button class="tab">Events</button></div>${inspector()}</aside>
        <footer class="a-status"><span>Runtime protocol v1 · 0 errors · 2 warnings</span><span>Agent applying 3 operations · Esc to cancel</span><span>Surreal local · sync cursor 184</span></footer>
      </div>`;
    }
    function variantB() {
      return `<div class="variant-b"><header class="b-topbar">${topbarCore()}<div class="toolbar-group"><button class="mode-button">Catalog</button><span class="small">/</span><button class="mode-button">Design</button></div><div class="toolbar-group"><span class="badge green">Saved</span><button class="quiet-button">Preview</button><button class="primary-button">Build</button></div></header>
        <main class="b-workspace canvas-grid"><div class="b-command">⌘ <span>Search commands, primitives, assets, content, or ask Studio Agent…</span><span class="badge" style="margin-left:auto">⌘K</span></div>
          <nav class="b-rail"><button class="tool active">↖</button><button class="tool">＋</button><button class="tool">T</button><button class="tool">▧</button><button class="tool">◇</button><div style="height:1px;background:var(--line)"></div><button class="tool">▦</button><button class="tool">↯</button><button class="tool">AI</button></nav>
          <section class="b-stage">${foodFrame()}</section>
          <aside class="b-context"><div class="section-title"><span>${state.selected}</span><span class="badge green">Valid</span></div><div class="tab-strip"><button class="tab active">Style</button><button class="tab">Bind</button><button class="tab">Event</button></div>${inspector()}</aside>
          <section class="b-dock"><div class="b-agent"><div style="display:flex;justify-content:space-between"><div><div class="eyebrow">Studio Agent · live edit</div><div class="label" style="margin-top:3px">“Make the sale badge clearer across all profiles.”</div></div><button class="quiet-button" data-agent>${state.agent === 'applying' ? 'Cancel run' : 'Run again'}</button></div><div class="op-list" style="margin-top:11px"><span class="op">✓ Move into Stack overlay</span><span class="op">✓ Bind sale.surface</span><span class="op">○ Validate 8 profiles</span></div><div class="activity-line"><span></span></div></div><div class="b-history"><div class="eyebrow">Undo group · agent-run-92</div>${historyRows()}</div></section>
        </main></div>`;
    }
    function variantC() {
      return `<div class="variant-c"><header class="c-topbar"><div>${topbarCore()}</div><div style="justify-content:center"><button class="tab active">Design</button><button class="tab">Prototype</button><button class="tab">Content</button><button class="tab">Extensions</button><button class="tab">Build</button></div><div style="justify-content:flex-end"><span class="badge green">Cloud saved</span><button class="primary-button">Run app</button></div></header>
        <aside class="c-flow"><div class="section-title"><span>Checkout journey</span><button class="icon-button">＋</button></div><div class="journey"><div class="screen-card active"><div class="screen-thumb"></div><div class="label">01 · Catalog</div><div class="small">entry · 8 profiles · 0 errors</div></div><div class="flow-arrow"></div><div class="screen-card"><div class="screen-thumb"></div><div class="label">02 · Product detail</div><div class="small">on product press</div></div><div class="flow-arrow"></div><div class="screen-card"><div class="screen-thumb"></div><div class="label">03 · Cart</div><div class="small">collection: cart.lines</div></div><div class="flow-arrow"></div><div class="screen-card"><div class="screen-thumb"></div><div class="label">04 · Checkout</div><div class="small">extension: stripe.test</div></div></div><div class="c-library"><div class="section-title"><span>Library shelf</span><span class="badge">Content</span></div><div class="node-row"><span class="kind">▦</span>catalog.products <span class="badge" style="margin-left:auto">12</span></div><div class="node-row"><span class="kind">▧</span>dish-images <span class="badge" style="margin-left:auto">12</span></div><div class="node-row"><span class="kind">◇</span>Product Card</div><div class="node-row"><span class="kind">↯</span>Stripe Test</div></div></aside>
        <main class="c-stage"><div class="stage-toolbar"><div class="toolbar-group"><span class="eyebrow">Screen</span><b>Catalog</b><span class="badge">Runtime valid</span></div><div class="toolbar-group"><select class="select" data-profile>${profileOptions()}</select><button class="quiet-button">Compare</button><button class="quiet-button">▶ Journey</button></div></div><div class="c-canvas canvas-grid">${foodFrame()}</div></main>
        <aside class="c-deck"><div class="tab-strip"><button class="tab active">Node</button><button class="tab">Content</button><button class="tab">Logic</button><button class="tab">Build</button></div><div class="deck-body">${inspector()}<div class="section-title"><span>Layers in context</span></div>${tree()}</div><div><div class="section-title"><span>Build readiness</span><span class="badge amber">2 warnings</span></div><div class="build-card"><div class="build-step"><span class="history-dot"></span><span>Runtime projection valid</span></div><div class="build-step"><span class="history-dot"></span><span>12 Library assets packaged</span></div><div class="build-step"><span class="history-dot" style="background:var(--amber)"></span><span>OAuth sandbox credential needed</span></div><button class="primary-button" style="width:100%;height:31px;margin-top:8px">Build signed .studio</button></div></div></aside>
      </div>`;
    }
    function switcher(v) {
      return `<div class="prototype-switcher"><button data-cycle="-1" aria-label="Previous variant">←</button><div class="variant-label">${v.key} · ${v.name}</div><button data-cycle="1" aria-label="Next variant">→</button></div><details class="state-peek"><summary>Prototype state</summary><pre>${JSON.stringify(state, null, 2)}</pre></details>`;
    }
    function render() {
      const v = currentVariant();
      document.getElementById('app').innerHTML = (v.key === 'A' ? variantA() : v.key === 'B' ? variantB() : variantC()) + switcher(v);
      document.querySelectorAll('[data-profile]').forEach(el => el.addEventListener('change', e => { state.profile = e.target.value; render(); }));
      document.querySelectorAll('[data-select]').forEach(el => el.addEventListener('click', e => { state.selected = e.currentTarget.dataset.select; render(); }));
      document.querySelectorAll('[data-cycle]').forEach(el => el.addEventListener('click', e => cycle(Number(e.currentTarget.dataset.cycle))));
      document.querySelectorAll('[data-agent]').forEach(el => el.addEventListener('click', () => { state.agent = state.agent === 'applying' ? 'cancelled' : 'applying'; render(); }));
    }
    function cycle(delta) {
      const current = variants.findIndex(v => v.key === currentVariant().key);
      const next = variants[(current + delta + variants.length) % variants.length];
      const url = new URL(location.href); url.searchParams.set('variant', next.key); window.history.replaceState({}, '', url); render();
    }
    addEventListener('keydown', event => {
      if (['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    addEventListener('popstate', render);
    render();
  </script>
</body>
</html>
